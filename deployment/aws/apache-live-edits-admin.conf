# Live Edits C9 admin console
# This file adds one isolated reverse-proxy path. It does not replace or alter
# the existing English/French virtual hosts, document roots, or static aliases.

ProxyPass "/_live-edits/v4/admin/" "http://127.0.0.1:3100/" connectiontimeout=5 timeout=330 retry=0
ProxyPassReverse "/_live-edits/v4/admin/" "http://127.0.0.1:3100/"

RedirectMatch 302 "^/_live-edits/v4/admin$" "/_live-edits/v4/admin/"

<Location "/_live-edits/v4/admin/">
    Require all granted
    RequestHeader set X-Forwarded-Proto "https"
</Location>
