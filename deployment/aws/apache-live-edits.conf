# Health Infobase Live Edits static preview policy
# Install as /etc/httpd/conf.d/live-edits.conf on Amazon Linux or RHEL.
# The English and French VirtualHosts may keep their existing DocumentRoot directives.

# Deny the Live Edits parent by default. Only the two required static subtrees
# are opened below. Private state and backups must remain outside both web roots.
<Directory "/home/ec2-user/environment/wwwroot/_live-edits/v4">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    Require all denied
</Directory>

# The editor is a static JavaScript asset used by both locale sites.
<DirectoryMatch "^/home/ec2-user/environment/wwwroot/_live-edits/v4/widget(?:/|$)">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    Require all granted

    <FilesMatch "(?i)(^\.|~$|\.(?:bak|bat|cer|cgi|cmd|com|crt|db|dll|exe|key|log|p12|pem|pfx|php|pl|ps1|py|sh|sqlite|sqlite3)$)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Staged products remain readable at their preview URLs. The application shared
# access code is still required for API reads and writes, comments, history, and
# presence. Use apache-live-edits-private.conf.example if the HTML must also be private.
<DirectoryMatch "^/home/ec2-user/environment/wwwroot/_live-edits/v4/products(?:/|$)">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    Require all granted

    <FilesMatch "(?i)(^\.|~$|\.(?:bak|bat|cer|cgi|cmd|com|crt|db|dll|exe|key|log|p12|pem|pfx|php|pl|ps1|py|sh|sqlite|sqlite3)$)">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Setup uses hidden, short lived build directories before an atomic rename.
<DirectoryMatch "^/home/ec2-user/environment/wwwroot/_live-edits/v4/products/(?:en|fr)/\.[^/]+(?:/|$)">
    Require all denied
</DirectoryMatch>
